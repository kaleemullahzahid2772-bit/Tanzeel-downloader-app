services:
  - type: web
    name: tanzeel-downloader-app-1
    env: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: YT_DLP_PATH
        value: /usr/local/bin/yt-dlp
